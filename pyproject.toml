[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "botkit"
version = "0.1.0"
description = "An aiogram 3 Telegram bot starter with FSM forms, i18n, role-based access, rate limiting and a safe broadcast."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Artem", email = "why.not.live.alone@gmail.com" }]
keywords = ["telegram", "bot", "aiogram", "fsm", "i18n", "starter", "template"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "aiogram>=3.7",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
postgres = ["asyncpg>=0.29"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
botkit = "botkit.bot:main"

[project.urls]
Repository = "https://github.com/why-xdd/botkit"
Issues = "https://github.com/why-xdd/botkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/botkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 95
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
